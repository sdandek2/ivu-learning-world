name: Quality checks

on:
  push:
    branches:
      - main
      - feature/ivu-cinematic-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Curriculum, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Refresh lockfile for patched test tooling
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency security audit
        run: npm audit --json > npm-audit.json

      - name: Enforce dependency security baseline
        run: npm audit --audit-level=moderate

      - name: Validate curriculum without rewriting generated files
        run: npm run validate

      - name: Run curriculum quality audit (heuristic screen)
        run: npm run audit:curriculum

      - name: Upload curriculum quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-quality-audit
          path: |
            docs/CURRICULUM_QUALITY_AUDIT.md
            curriculum/QUALITY_AUDIT.json
            npm-audit.json
            package-lock.json
          if-no-files-found: warn

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install Playwright for browser smoke test
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end smoke test
        run: npm run e2e
