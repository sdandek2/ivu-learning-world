name: Quality checks

on:
  push:
    branches:
      - main
      - feature/ivu-cinematic-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Curriculum, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate curriculum without rewriting generated files
        run: npm run validate

      - name: Run curriculum quality audit (heuristic screen)
        run: npm run audit:curriculum

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application
        run: npm run build
