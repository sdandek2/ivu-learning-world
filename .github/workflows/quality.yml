name: Quality checks

on:
  push:
    branches:
      - main
      - feature/ivu-cinematic-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Curriculum, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Refresh lockfile for patched test tooling
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated patched lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ivu-cinematic-redesign'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for patched Vitest"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency security audit
        run: npm audit --json > npm-audit.json

      - name: Enforce dependency security baseline
        run: npm audit --audit-level=moderate

      - name: Validate curriculum without rewriting generated files
        run: npm run validate

      - name: Run curriculum quality audit (heuristic screen)
        run: npm run audit:curriculum

      - name: Upload curriculum quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-quality-audit
          path: |
            docs/CURRICULUM_QUALITY_AUDIT.md
            curriculum/QUALITY_AUDIT.json
            npm-audit.json
            package-lock.json
          if-no-files-found: warn

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Check generated curriculum files are committed and up to date
        run: |
          if ! git diff --exit-code --stat -- public/curriculum curriculum/MANIFEST.json docs/CURRICULUM_MANIFEST.md; then
            echo "::error::Generated curriculum files are out of date. Run 'npm run build' locally and commit the changes."
            exit 1
          fi

      - name: Install Playwright for browser smoke test
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end smoke test
        run: npm run e2e
