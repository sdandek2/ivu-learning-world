<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVU Reads! · IVU Learning World</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --ink:#23264a; --muted:#6b6f93; --line:#e7e9f5;
    --cons:#2f6fed; --vowel:#f0386b; --pair:#8b5cf6;
    --good:#22c55e; --good-d:#15803d; --help:#f5b316; --help-d:#b7820b; --miss:#ff6b4a; --miss-d:#c2410c;
    --orange:#ff8a3d; --orange-d:#e0601a; --teal:#19c3a6; --teal-d:#0f8f79; --purple:#8b5cf6; --purple-d:#6d3fd8;
    --gold:#ffc93c; --card:rgba(255,255,255,.88);
    --shadow:0 18px 50px rgba(35,50,120,.16), 0 3px 10px rgba(35,50,120,.08);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --ui:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --read:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--ui);color:var(--ink);background:#bfe9ff;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 20px 40px;position:relative;z-index:1}
  .hidden{display:none !important}

  /* ---------- Sky scene ---------- */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#9fdcff 0%,#cdeeff 45%,#fff3d9 100%)}
  .sun{position:absolute;top:-60px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0%,#ffd84d 55%,rgba(255,216,77,0) 72%);animation:sunPulse 6s ease-in-out infinite}
  @keyframes sunPulse{50%{transform:scale(1.07)}}
  .cloud{position:absolute;width:180px;height:60px;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 8px 10px rgba(80,120,180,.12));animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:80px;height:80px;top:-40px;left:28px}
  .cloud::after{width:100px;height:100px;top:-55px;left:70px}
  .c1{top:12%;animation-duration:70s;animation-delay:-10s}
  .c2{top:30%;transform:scale(.7);animation-duration:95s;animation-delay:-50s;opacity:.75}
  .c3{top:6%;transform:scale(.5);animation-duration:120s;animation-delay:-80s;opacity:.7}
  @keyframes drift{from{left:-260px}to{left:110vw}}
  .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:28vh}

  /* ---------- Common ---------- */
  .glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:32px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.9)}
  .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:600;box-shadow:0 4px 14px rgba(35,50,120,.1)}
  .btn3d{position:relative;border-radius:28px;color:#fff;font-weight:700;letter-spacing:.2px;transition:transform .15s var(--spring),box-shadow .15s,filter .15s;box-shadow:0 8px 0 var(--d),0 16px 30px rgba(0,0,0,.14);background:var(--c)}
  .btn3d:hover{filter:brightness(1.05);transform:translateY(-2px)}
  .btn3d:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d),0 6px 12px rgba(0,0,0,.12)}
  .btn3d:disabled{filter:saturate(.4) opacity(.6);transform:none}
  .b-orange{--c:linear-gradient(180deg,#ffa25c,#ff7a2e);--d:var(--orange-d)}
  .b-teal{--c:linear-gradient(180deg,#2fd9bb,#14b096);--d:var(--teal-d)}
  .b-purple{--c:linear-gradient(180deg,#a17cff,#7c4dff);--d:var(--purple-d)}
  .b-good{--c:linear-gradient(180deg,#3ddc76,#1fb956);--d:var(--good-d)}
  .b-help{--c:linear-gradient(180deg,#ffcd3f,#f2a90c);--d:var(--help-d)}
  .b-miss{--c:linear-gradient(180deg,#ff8566,#ff5a36);--d:var(--miss-d)}
  .roundbtn{width:60px;height:60px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 6px 0 #d9ddef,0 10px 20px rgba(35,50,120,.12);transition:transform .15s var(--spring)}
  .roundbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9ddef}
  .screen{animation:screenIn .5s var(--spring)}
  @keyframes screenIn{from{opacity:0;transform:translateY(24px) scale(.98)}}

  /* ---------- Mascot ---------- */
  .mascot{width:120px;height:100px;flex:none;animation:bob 2.4s ease-in-out infinite}
  .mascot .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
  .mascot .lid{transform-box:fill-box;transform-origin:center top;animation:blink 4.5s infinite}
  .mascot.happy{animation:jump .7s var(--spring) 2}
  .mascot.think{animation:tilt 1.2s ease-in-out 2}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
  @keyframes jump{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-34px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}}
  @keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .bubble{position:relative;background:#fff;border-radius:26px;padding:14px 22px;font-size:26px;font-weight:600;box-shadow:var(--shadow);animation:pop .6s var(--spring) .2s both}
  .bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid #fff;border-left:0}

  /* ---------- Home ---------- */
  .hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hero .hi{display:flex;align-items:center;gap:20px;flex:1;min-width:300px}
  .hero .hi h1{margin:0;font-size:clamp(40px,6vw,64px);line-height:1;color:#1f2a6b;text-shadow:0 3px 0 #fff}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .mapcard{margin:20px 0;padding:18px 20px 8px}
  .mapcard h2{margin:0 0 4px 6px;font-size:24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .mapcard h2 small{font-size:16px;color:var(--muted);font-weight:500}
  .map{position:relative;width:100%;margin-top:34px}
  .map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .road-base{fill:none;stroke:#5a6180;stroke-width:46;stroke-linecap:round;stroke-linejoin:round}
  .road-edge{fill:none;stroke:#7ed957;stroke-width:62;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
  .road-dash{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:20 18;stroke-linecap:round;animation:dash 2.5s linear infinite;opacity:.9}
  .road-done{fill:none;stroke:#ffc93c;stroke-width:10;stroke-linecap:round;opacity:.95;filter:drop-shadow(0 0 6px rgba(255,201,60,.8))}
  @keyframes dash{to{stroke-dashoffset:-76}}
  .node{position:absolute;transform:translate(-50%,-50%);width:clamp(62px,9.4vw,96px);aspect-ratio:1;border-radius:50%;padding:0;background:conic-gradient(var(--good) calc(var(--p)*1turn),#e4e7f3 0);box-shadow:0 7px 0 rgba(0,0,0,.12),0 12px 24px rgba(35,50,120,.18);transition:transform .2s var(--spring);animation:nodeIn .6s var(--spring) both;animation-delay:calc(var(--i)*60ms)}
  .node:hover{transform:translate(-50%,-50%) scale(1.08)}
  .node:active{transform:translate(-50%,-50%) scale(.95)}
  .node .in{position:absolute;inset:clamp(5px,.8vw,8px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4.4vw,46px)}
  .node.locked .in{filter:grayscale(1);opacity:.55}
  .node.locked::after{content:"🔒";position:absolute;right:-4px;top:-4px;font-size:clamp(14px,2vw,20px)}
  .node.done::after{content:"🏅";position:absolute;right:-8px;top:-8px;font-size:clamp(18px,2.6vw,28px);animation:pop .6s var(--spring)}
  .node.cur{box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 6px rgba(255,138,61,.35),0 0 30px rgba(255,138,61,.7);animation:nodeIn .6s var(--spring) both,glow 1.8s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 12px rgba(255,138,61,.15),0 0 40px rgba(255,138,61,.9)}}
  @keyframes nodeIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
  .nlabel{position:absolute;transform:translateX(-50%);text-align:center;font-weight:700;font-size:clamp(12px,1.6vw,17px);line-height:1.1;color:#1f2a6b;background:rgba(255,255,255,.92);padding:3px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(35,50,120,.1)}
  .nlabel small{display:block;font-weight:500;color:var(--muted);font-size:.78em}
  .carpin{position:absolute;transform:translate(-50%,-100%);width:clamp(64px,9vw,96px);pointer-events:none;z-index:3;transition:left .9s var(--spring),top .9s var(--spring)}
  .carpin .mascot{width:100%;height:auto}
  .playrow{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin:6px 0 20px}
  .playrow .btn3d{font-size:clamp(24px,3vw,32px);padding:26px 18px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left}
  .playrow .btn3d .ic{font-size:1.6em;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
  .playrow .btn3d small{display:block;font-size:.55em;font-weight:500;opacity:.92}
  .shelf{padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .shelf b{font-size:20px}
  .shelf .st{font-size:42px;display:inline-block;animation:pop .6s var(--spring) both}
  .shelf .empty{color:var(--muted);font-size:18px}
  .grownup{margin-top:18px;background:rgba(255,255,255,.7);color:#4b4f7a;font-size:16px;padding:10px 18px;border-radius:14px;position:relative;overflow:hidden}
  .grownup .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#d8ccff;z-index:0}
  .grownup span{position:relative;z-index:1}

  /* ---------- Bottom sheet ---------- */
  .overlay{position:fixed;inset:0;background:rgba(25,30,70,.35);backdrop-filter:blur(3px);z-index:40;animation:fadeIn .25s}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-radius:34px 34px 0 0;padding:26px 26px 30px;z-index:41;box-shadow:0 -20px 60px rgba(25,30,70,.25);animation:sheetUp .45s var(--spring)}
  .sheet .grab{width:60px;height:6px;border-radius:3px;background:#dde0ee;margin:-10px auto 14px}
  .sheet .head{display:flex;align-items:center;gap:18px}
  .sheet .big{font-size:72px;animation:pop .6s var(--spring)}
  .sheet h2{margin:0;font-size:30px}
  .sheet p{margin:4px 0 0;color:var(--muted);font-size:19px}
  .sheet .bar{height:14px;background:#eef0f8;border-radius:7px;overflow:hidden;margin:16px 0 6px}
  .sheet .bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc76,#19c3a6);border-radius:7px;transition:width .8s var(--spring)}
  .sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .sheet .btns .btn3d{font-size:24px;padding:20px 12px}
  .sheet .btns small{display:block;font-size:15px;font-weight:500;opacity:.9}
  .sheet .x{position:absolute;right:18px;top:16px;width:44px;height:44px;border-radius:50%;background:#f1f2f8;font-size:20px}
  @keyframes sheetUp{from{transform:translate(-50%,100%)}}
  @keyframes fadeIn{from{opacity:0}}

  /* ---------- Session ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .track{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
  .track i{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;border-radius:50%;background:rgba(255,255,255,.75);color:#c9cde3;transition:transform .3s var(--spring)}
  .track i::before{content:"★"}
  .track i.c,.track i.p{color:var(--gold);background:#fff;transform:scale(1.15);text-shadow:0 0 8px rgba(255,201,60,.8)}
  .track i.h{color:var(--help);background:#fff}
  .track i.x{color:var(--miss);background:#fff}
  .track i.x::before{content:"●"}
  .track i.now{outline:3px solid #fff;box-shadow:0 0 0 6px rgba(255,138,61,.5);color:var(--orange)}
  .starcount{font-size:24px}
  .starcount.bump{animation:bump .5s var(--spring)}
  @keyframes bump{40%{transform:scale(1.35)}}
  .stagewrap{position:relative;margin:18px 0 16px}
  .stage{min-height:min(52vh,420px);padding:34px 26px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .stagewrap{perspective:1800px}
  .flipper{position:relative;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.3,1.35,.5,1);animation:cardIn .6s var(--spring)}
  .flipper.flipped{transform:rotateY(180deg)}
  .flipper.out{animation:cardOut .35s ease-in forwards}
  .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.97)}
  .face.back{position:absolute;inset:0;transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,#fffdf3 0%,#fff3d6 55%,#ffe3ef 100%);overflow:hidden}
  .face.back::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.16) 0 10deg,transparent 10deg 20deg);animation:rays 18s linear infinite}
  @keyframes rays{to{transform:rotate(360deg)}}
  .face.back>*{position:relative}
  .flipped .face.back .pic{animation:picIn .8s var(--spring) .35s both}
  @keyframes picIn{from{transform:scale(.2) rotate(-25deg);opacity:0}}
  .backword{font-family:var(--read);font-weight:700;font-size:clamp(44px,7vw,84px);color:var(--ink);text-align:center;line-height:1.15;padding:0 20px}
  .backword.long{font-size:clamp(26px,3.6vw,40px)}
  .backword small{display:block;font-size:.45em;color:var(--muted);font-weight:400}
  .fliphint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#a3a7c4;font-size:15px}
  .flipbtn{position:absolute;top:12px;right:14px;background:#f3f4fb;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:600;color:#4b4f7a;z-index:2}
  @keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(2deg) scale(.94)}}
  @keyframes cardOut{to{opacity:0;transform:translateX(-80px) rotate(-3deg) scale(.94)}}
  .lvtag{position:absolute;top:16px;left:20px;font-size:16px;font-weight:600;color:var(--muted);background:#f3f4fb;padding:4px 12px;border-radius:999px}
  .stagewrap{position:relative} .stagewrap>.mascot{position:absolute;right:-34px;bottom:-18px;width:100px;height:84px;z-index:3}
  .word{display:flex;gap:16px;justify-content:center;transition:gap .5s var(--spring)}
  .word.blend{gap:0}
  .g{font-family:var(--read);font-size:clamp(90px,14vw,160px);line-height:1.05;font-weight:700;padding:0 12px;border-radius:24px;cursor:pointer;user-select:none;color:var(--cons);display:inline-block;transition:background .2s,transform .25s var(--spring),padding .5s var(--spring);animation:letterIn .6s var(--spring) both;animation-delay:calc(var(--i,0)*90ms + 150ms);text-shadow:0 4px 0 rgba(35,50,120,.08)}
  .g.v{color:var(--vowel)} .g.d{color:var(--pair);text-decoration:underline;text-decoration-thickness:7px;text-underline-offset:16px}
  .g.on{background:#fff2b3;transform:translateY(-12px) scale(1.12)}
  .word.blend .g{padding:0 2px}
  @keyframes letterIn{from{opacity:0;transform:translateY(40px) scale(.4) rotate(-10deg)}}
  .sightword{font-family:var(--read);font-size:clamp(90px,14vw,160px);font-weight:700;color:var(--ink);background:linear-gradient(transparent 62%,rgba(255,201,60,.55) 62%);padding:0 18px;border-radius:14px;cursor:pointer;animation:letterIn .7s var(--spring) both .15s;transition:transform .25s var(--spring)}
  .sightword.on{background:#fff2b3;transform:scale(1.08)}
  .badge{background:linear-gradient(180deg,#ffd75e,#ffc021);color:#5b4300;border-radius:999px;padding:6px 16px;font-size:18px;font-weight:600;margin-bottom:14px;box-shadow:0 4px 0 #e0a50e}
  .phrase{display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:center;align-items:baseline;font-family:var(--read)}
  .wchip{display:inline-flex;cursor:pointer;border-radius:16px;padding:0 6px;transition:background .2s,transform .25s var(--spring);animation:letterIn .6s var(--spring) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
  .wchip.on{background:#fff2b3;transform:translateY(-6px)}
  .wchip .g{font-size:inherit;padding:0 1px;border-radius:8px;animation:none;text-shadow:none}
  .wchip .g.on{transform:none;background:#ffe27a}
  .wchip.sw{background:linear-gradient(transparent 64%,rgba(255,201,60,.5) 64%)}
  .wchip.sw.on{background:#fff2b3}
  .wchip.punct{cursor:default}
  .fs-phrase{font-size:clamp(56px,9vw,100px);font-weight:700}
  .fs-line{font-size:clamp(40px,6vw,66px);font-weight:700}
  .fs-sentence{font-size:clamp(34px,5vw,54px);font-weight:700}
  .story{width:100%}
  .story h3{text-align:center;font-size:32px;margin:6px 0 14px;color:var(--purple)}
  .story .sline{display:flex;align-items:center;gap:12px;margin:8px 0;animation:screenIn .5s var(--spring) both;animation-delay:calc(var(--i,0)*90ms)}
  .story .phrase{justify-content:flex-start;gap:6px 18px;font-size:clamp(28px,3.6vw,40px);font-weight:700}
  .say{background:#eef2ff;border-radius:14px;font-size:22px;padding:8px 10px;flex:none;transition:transform .2s var(--spring)}
  .say:active{transform:scale(.9)}
  .pic{font-size:clamp(110px,16vw,170px);height:auto;line-height:1.1;margin-top:8px;transition:opacity .3s,transform .5s var(--spring)}
  .pic.hide{opacity:0;transform:scale(.3) rotate(-20deg)}
  .praise{font-size:34px;color:var(--good-d);font-weight:700;min-height:44px;margin-top:2px;text-align:center}
  .praise.show{animation:pop .5s var(--spring)}
  .tools{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .tool{background:#fff;color:#2b3a8a;font-size:22px;font-weight:600;padding:14px 24px;border-radius:999px;box-shadow:0 6px 0 #d9ddef,0 10px 20px rgba(35,50,120,.1);transition:transform .15s var(--spring)}
  .tool:hover{transform:translateY(-2px)}
  .tool:active{transform:translateY(4px);box-shadow:0 2px 0 #d9ddef}
  .tool:disabled{opacity:.4}
  .marks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  .mark{font-size:26px;padding:20px 10px}
  .marks.solo{grid-template-columns:1fr 1fr}
  .session-nav{display:flex;justify-content:center;margin:12px 0 22px}
  .session-nav .btn3d{font-size:20px;padding:12px 34px}
  .whohint{text-align:center;color:var(--muted);font-size:16px;margin-top:14px}
  .legend{display:flex;gap:16px;justify-content:center;color:var(--muted);font-size:16px;margin-top:12px;flex-wrap:wrap}
  .legend b.v{color:var(--vowel)} .legend b.c{color:var(--cons)} .legend b.d{color:var(--pair)} .legend b.s{background:rgba(255,201,60,.5);padding:0 6px;border-radius:6px}
  .flystar{position:fixed;font-size:54px;z-index:60;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(255,180,0,.6))}
  .spark{position:fixed;width:12px;height:12px;border-radius:3px;z-index:59;pointer-events:none}

  /* ---------- Goal, games, garage ---------- */
  .goal .ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(#ff8a3d calc(var(--g)*1turn),#eceef7 0);display:inline-flex;align-items:center;justify-content:center}
  .goal .ring span{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .goal.done{background:linear-gradient(180deg,#fff6d8,#ffe6a6)}
  .goal.done .ring{background:var(--good)}
  .games{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:0 0 20px}
  .deckinfo{flex:1;text-align:center;font-size:22px;font-weight:600;color:#1f2a6b}
  .decklevels{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:thin}
  .dl{flex:none;background:rgba(255,255,255,.8);border-radius:16px;padding:6px 10px;font-size:24px;display:flex;flex-direction:column;align-items:center;min-width:72px;transition:transform .2s var(--spring)}
  .dl small{font-size:12px;font-weight:600;color:var(--muted)}
  .dl.on{background:#fff;box-shadow:0 0 0 3px var(--orange);transform:scale(1.06)}
  .deckcard .front{cursor:pointer}
  @keyframes cardInL{from{opacity:0;transform:translateX(-60px) rotate(-2deg) scale(.94)}}
  .decknav .tool:disabled{opacity:.35}
  .gamecard{padding:18px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;transition:transform .2s var(--spring)}
  .gamecard:hover{transform:translateY(-4px) rotate(-1deg)}

/* ---------- Refined, calmer reading-first visual system ---------- */
:root{

  --gold:#e5bd62; --card:#fffefa; --shadow:0 8px 28px rgba(47,55,66,.08);

const VOWELS='aeiou';
function graphemes(word){
  const w=word; const lw=w.toLowerCase(); const out=[]; let i=0;
  while(i<w.length){
    const two=lw.slice(i,i+2);
    if(['sh','ch','th','ck','ee','oo','ai','oa','ar','or'].includes(two) || (two.length===2 && two[0]===two[1] && 'lsfz'.includes(two[0]))){ out.push(w.slice(i,i+2)); i+=2; continue; }
    out.push(w[i]); i++;
  }
  return out;
}
function soundKey(g){ const l=g.toLowerCase(); if(l.length===2 && l[0]===l[1]) return l[0]; return l; }
function soundKeys(word){ const gs=graphemes(word); return gs.map((g,i)=>{ const l=g.toLowerCase(); if(l==='q') return 'c'; if(l==='u' && i>0 && gs[i-1].toLowerCase()==='q') return 'w'; return soundKey(g); }); }
const VTEAMS=['ee','oo','ai','oa','ar','or'];
function gClass(g){ const l=g.toLowerCase(); if(VTEAMS.includes(l)) return 'v d'; if(l.length===2) return l[0]===l[1]?'':'d'; return VOWELS.includes(l)?'v':''; }
function clean(w){ return w.toLowerCase().replace(/[^a-z]/g,''); }
function isSight(w){ return SIGHT.has(clean(w)); }
function tokens(text){ return text.split(/\s+/).filter(Boolean); }
function picFor(item){
  if(item.type==='letter') return LETTER_PIC[item.text]||'⭐';
  if(item.type==='word'||item.type==='sight') return PIC[clean(item.text)]||'⭐';
  const words = item.lines ? item.lines.join(' ') : item.text;
  const ems=[]; tokens(words).forEach(w=>{const e=PIC[clean(w)]; if(e && !ems.includes(e) && !['🔴','🔥'].includes(e)) ems.push(e);});
  return (ems.slice(0,3).join('')) || '⭐';
}

let actx=null;
function chime(good=true){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good? [660,880,1320] : [440,370];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
      const t=actx.currentTime+i*0.11; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}

/* stretchy word: "caaaat" (same voice, slowed down without changing pitch) */
function speakStretch(word){ const c=clipFor(word); return c? playUrl(c,0.55) : speak(word,0.5); }
/* Sound-it-out routine on an element containing .g spans */
async function soundOut(el, word, {model=true}={}){
  stopAll(); const my=runId;
  const gs=[...el.querySelectorAll('.g')];
  const keys=soundKeys(word);
  const ok=()=>my===runId;
  el.classList.remove('blend');
  // slow
  for(let k=0;k<gs.length;k++){ if(!ok())return; gs.forEach(x=>x.classList.remove('on')); gs[k].classList.add('on'); await playSound(keys[k]); await wait(450); }
  gs.forEach(x=>x.classList.remove('on')); if(!ok())return; await wait(350);
  if(model){
    // faster
    for(let k=0;k<gs.length;k++){ if(!ok())return; gs.forEach(x=>x.classList.remove('on')); gs[k].classList.add('on'); await playSound(keys[k]); await wait(60); }
    gs.forEach(x=>x.classList.remove('on')); if(!ok())return; await wait(200);
    // stretchy: slide the sounds together
    el.classList.add('blend'); gs.forEach(x=>x.classList.add('on')); await speakStretch(word); if(!ok())return; gs.forEach(x=>x.classList.remove('on')); await wait(250);
  }
  // blend
  el.classList.add('blend'); gs.forEach(x=>x.classList.add('on'));
  await speak(word, 0.9);
  await wait(250); gs.forEach(x=>x.classList.remove('on'));
}

/* read a whole line: deliberate word-by-word read-along, then fluent model */
const READ_ALONG_RATE = 0.80; // recorded sentence clips were too brisk for early readers
async function readLine(container, text){
  stopAll(); const my=runId;

  const all=[...container.querySelectorAll('.wchip')], T=(window.CLIP_TIMES||{})['t:'+text], clip=clipFor(text);
  if(T && clip && T.length===all.length){
    const p=playUrl(clip, READ_ALONG_RATE);
    T.forEach((st,i)=>setTimeout(()=>{ if(my!==runId) return; all.forEach(c=>c.classList.remove('on')); if(!all[i].classList.contains('punct')) all[i].classList.add('on'); }, st*1000/READ_ALONG_RATE+40));
    await p;
    if(my===runId){ all.forEach(c=>c.classList.remove('on')); await wait(400); }

function blendBarHTML(){ return `<div class="blendbar" id="bb" title="Drive the car to blend the sounds"><div class="btrack"></div><div class="bdots"></div><div class="bcar">🚗</div><div class="bflag">🏁</div></div>`; }
function attachBlendBar(wordEl, word){

  setTimeout(layout,700);

  const reach=async f=>{
    centers.forEach((c,i)=>{ if(f>=c-0.02 && !played.has(i)){ played.add(i); gs.forEach(x=>x.classList.remove('on')); gs[i].classList.add('on'); dotsEl.children[i]&&dotsEl.children[i].classList.add('lit'); playSound(keys[i]); } });

  };
  const frac=e=>{ const br=bar.getBoundingClientRect(); return (e.clientX-br.left)/br.width; };
  const reset=()=>{ played=new Set(); done=false; wordEl.classList.remove('blend'); [...dotsEl.children].forEach(d=>d.classList.remove('lit')); };
  bar.addEventListener('pointerdown',e=>{ e.preventDefault(); stopAll(); sess&&(sess.helped=true); layout(); reset(); dragging=true; moved=false; startX=e.clientX; bar.setPointerCapture(e.pointerId); const f=frac(e); if(f<0.2) setPos(f); });
  bar.addEventListener('pointermove',e=>{ if(!dragging) return; if(Math.abs(e.clientX-startX)>8) moved=true; const f=Math.max(0,frac(e)); setPos(f); reach(f); });
  bar.addEventListener('pointerup',async e=>{ if(!dragging) return; dragging=false;
    if(!moved){ // tap: the car drives by itself, slowly
      const my=runId; for(let f=0; f<=1.0001; f+=0.01){ if(my!==runId) return; setPos(f); reach(f); await wait(28); } }
    setTimeout(()=>{ if(!dragging){ car.style.transition='left .5s'; setPos(0); setTimeout(()=>car.style.transition='',520); } },1800);
  });
}
/* ---------------- Recording (trim silence -> small WAV) ---------------- */
async function recordSound(key, btn, after=renderParent){
  if(btn.classList.contains('live')) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Recording is not supported in this browser. Try Chrome.'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ alert('Microphone permission was blocked. Allow the mic for this page and try again.'); return; }
  const rec=new MediaRecorder(stream); const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  const stopped=new Promise(r=>rec.onstop=r);
  btn.classList.add('live'); btn.textContent='🔴 Say it!';
  rec.start(); await wait(1800); rec.stop(); await stopped;
  stream.getTracks().forEach(t=>t.stop());
  btn.classList.remove('live'); btn.textContent=btn.dataset.label||'🎤';
  try{
    const buf=await new Blob(chunks).arrayBuffer();
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const audio=await actx.decodeAudioData(buf);
    const url=await trimToWav(audio);
    if(!url){ alert('I could not hear anything. Try again a bit louder and closer to the mic.'); return; }
    sounds[key]=url; saveSounds(); await playUrl(url); after();
  }catch(e){ alert('Recording failed: '+e.message); }
}
async function trimToWav(audio){
  const RATE=16000;
  const off=new OfflineAudioContext(1, Math.ceil(audio.duration*RATE), RATE);
  const src=off.createBufferSource(); src.buffer=audio; src.connect(off.destination); src.start();
  const r=await off.startRendering(); let d=r.getChannelData(0);
  let peak=0; for(const v of d) peak=Math.max(peak,Math.abs(v));
  if(peak<0.02) return null;
  const th=peak*0.12; let s=0,e=d.length-1;
  while(s<d.length && Math.abs(d[s])<th) s++;
  while(e>s && Math.abs(d[e])<th) e--;
  const pad=Math.round(0.04*RATE); s=Math.max(0,s-pad); e=Math.min(d.length-1,e+pad);
  d=d.slice(s,e+1);
  const gain=0.9/peak;
  const bytes=new ArrayBuffer(44+d.length*2), v=new DataView(bytes);
  const ws=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+d.length*2,true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,RATE,true); v.setUint32(28,RATE*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++){ const x=Math.max(-1,Math.min(1,d[i]*gain)); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7fff, true); }
  return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(new Blob([bytes],{type:'audio/wav'})); });
}

/* ---------------- Session building ---------------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function needScore(item){
  const s=peek(item.id);
  if(!s || (s.c+s.h+s.x)===0) return 2 + item.order*0.04;          // new: in list order
  const base = s.last==='x'?0 : s.last==='h'?1 : 3;
  return base + s.c*0.4 + Math.random()*0.9;
}
function cardsFor(type){
  const n=state.settings.cards;
  if(type==='phrase') return Math.min(n,10);
  if(type==='line'||type==='sentence') return Math.min(n,8);
  if(type==='story') return 4;
  return n;
}
function buildSession(levelIdx){
  const L=LEVELS[levelIdx], cur=BY_LEVEL[levelIdx];
  const total=cardsFor(L.type);
  let nCur = levelIdx<=2 ? total : Math.round(total*0.7);
  if(L.type==='story') nCur=1;
  const notM=cur.filter(i=>!isMastered(i)).sort((a,b)=>needScore(a)-needScore(b));
  let pick=notM.slice(0,nCur);
  if(pick.length<nCur) pick=pick.concat(shuffle(cur.filter(i=>!pick.includes(i))).slice(0,nCur-pick.length));
  // review from earlier levels (skip letters unless missed)
  const prev=ITEMS.filter(i=>i.level<levelIdx && i.type!=='story' && (i.level>0 || (peek(i.id)&&peek(i.id).last!=='c')) && (L.type!=='story' || i.type==='line' || i.type==='sentence'));
  const seenPrev=prev.filter(i=>peek(i.id));
  const shaky=seenPrev.filter(i=>!isMastered(i)).sort((a,b)=>needScore(a)-needScore(b));
  const solid=shuffle(seenPrev.filter(isMastered));
  let review=shaky.slice(0,Math.ceil((total-pick.length)/2));
  review=review.concat(solid.filter(i=>!review.includes(i))).slice(0,total-pick.length);
  if(review.length<total-pick.length){ // not enough review: fill with more current-level items
    const more=shuffle(cur.filter(i=>!pick.includes(i))).slice(0,total-pick.length-review.length); pick=pick.concat(more);
  }
  let q=shuffle(pick.concat(review));
  if(L.type==='story'){ q=review.concat(pick); } // story last
  else {
    // end on success: put an easy (mastered) item last if we have one
    const easyIdx=q.findIndex(i=>isMastered(i));
    if(easyIdx>-1){ const [e]=q.splice(easyIdx,1); q.push(e); }
  }
  return q;
}

function roadLayout(){
  const cols = innerWidth<720 ? 2 : 4, W = cols===4?1000:600, rowH = cols===4?195:190, top=90;
  const rows=Math.ceil(LEVELS.length/cols), H=top+(rows-1)*rowH+90;
  const xs = Array.from({length:cols},(_,c)=> cols===4 ? 110+c*260 : 150+c*300);
  const pts=LEVELS.map((_,i)=>{ const r=Math.floor(i/cols), c=i%cols; return [r%2? xs[cols-1-c] : xs[c], top+r*rowH]; });
  let d=`M${xs[0]} ${top}`;
  for(let r=0;r<rows;r++){ const y=top+r*rowH, ltr=r%2===0; let xEnd= ltr? xs[cols-1]:xs[0]; if(r===rows-1) xEnd=pts[pts.length-1][0];
    d+=` L${xEnd} ${y}`;
    if(r<rows-1){ const k= ltr? 120 : -120; d+=` C${xEnd+k} ${y} ${xEnd+k} ${y+rowH} ${xEnd} ${y+rowH}`; } }
  return {W,H,pts,d};
}

    document.getElementById('swHear').onclick=()=>{stopAll(); speak(q.from);};
    document.querySelectorAll('#swChoices .ltile').forEach(b=>b.onclick=async()=>{
      if(done||b.disabled) return;
      if(b.dataset.c===to[q.at]){
        done=true; score+=wrong?0:1; b.classList.add('used');
        const letters=from.slice(); letters[q.at]=to[q.at];
        const row=document.querySelector('.word'); row.innerHTML=letters.map((c,i)=>`<span class="g ${gClass(c)}">${c}</span>`).join('');
        document.getElementById('swPraise').textContent=`Yes! ${q.from} becomes ${q.to}.`;
        document.getElementById('swHint').textContent=q.hint;
        addStar(); chime(true); await speak(q.to); document.getElementById('swNext').disabled=false;
      }else{
        wrong++; b.disabled=true; b.classList.add('wrong'); document.getElementById('swPraise').textContent='Listen to the word and try again.';
        if(wrong>=2) document.getElementById('swHint').textContent=q.hint;
        chime(false);
      }
    });
    document.getElementById('swNext').onclick=()=>{idx++;draw();};
  };
  draw();
}

/* ---------- Adaptive review: revisit items the child needed help with ---------- */
function startAdaptiveReview(){
  const eligible=ITEMS.filter(i=>i.level>0 && (i.type==='word'||i.type==='sight'||i.type==='phrase'||i.type==='line'||i.type==='sentence'));
  const scored=eligible.map(i=>{const x=peek(i.id); if(!x) return [i,0];
    const recent=(x.log||[]).slice(-5); const misses=recent.filter(v=>v[1]==='x').length; const helps=recent.filter(v=>v[1]==='h').length;
    const score=misses*4+helps*2+(x.last==='x'?3:x.last==='h'?1:0)+(isMastered(i)?0:1);
    return [i,score];
  }).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  let queue=scored.slice(0,8).map(x=>x[0]);
  if(queue.length<4){
    const fill=BY_LEVEL[state.currentLevel].filter(i=>i.type==='word'||i.type==='sight').filter(i=>!queue.includes(i));
    queue=queue.concat(fill.slice(0,Math.max(0,4-queue.length)));
  }
  if(!queue.length){ speak('Great! Let us practise some words.'); startSession('together',state.currentLevel,6); return; }
  sess={mode:'together',level:state.currentLevel,queue:shuffle(queue),idx:0,results:[],start:Date.now(),requeued:new Set(),answered:false};
  view='session'; renderCard(); speak('Let us practise some words together!');
}

function startSession(mode, levelIdx=state.currentLevel, n=0){
  let q=buildSession(levelIdx); if(n && q.length>n) q=q.slice(0,n-1).concat(q[q.length-1]);
  sess={mode, level:levelIdx, queue:q, idx:0, results:[], start:Date.now(), requeued:new Set(), answered:false};
  view='session'; renderCard();
  const T=LEVELS[levelIdx].type; speak(T==='story'?"Let's read a story!": (T==='word'&&levelIdx<=6)?'Say the sounds, then say them fast!':"Let's read!");
}

function wordHTML(word){
  return graphemes(word).map((g,i)=>`<span class="g ${gClass(g)}" style="--i:${i}">${esc(g)}</span>`).join('');
}
function phraseHTML(text){
  return tokens(text).map((tok,i)=>{
    const m=tok.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
    if(!m) return `<span class="wchip punct" style="--i:${i}">${esc(tok)}</span>`;
    const [,pre,w,post]=m; const sw=isSight(w);
    const inner = sw ? `<span>${esc(w)}</span>` : wordHTML(w);
    return `<span class="wchip ${sw?'sw':''}" data-w="${esc(w)}" style="--i:${i}">${esc(pre)}${inner}${esc(post)}</span>`;
  }).join('');
}

function flip(on=true){ const f=document.getElementById('stage'); if(!f) return; f.classList.toggle('flipped',on); }

  }

    });
    if(item.type==='story'){
      app.querySelectorAll('.say').forEach(b=>b.onclick=()=>{ help(); const ph=b.nextElementSibling; readLine(ph, ph.dataset.text); });
      $('tRead').onclick=()=>{ help(); readStory(); };

      $('tRead').onclick=()=>{ help(); readLine(w, item.text); };

/* ---------- Celebration effects ---------- */
const FX_COLORS=['#ff5a5f','#ffc93c','#22c55e','#2f6fed','#8b5cf6','#ff8a3d','#19c3a6','#f0386b'];
function centerOf(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function sparks(x,y,n=22){
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='spark'; s.style.left=x+'px'; s.style.top=y+'px'; s.style.background=FX_COLORS[i%FX_COLORS.length];
    if(i%3===0) s.style.borderRadius='50%';
    document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=90+Math.random()*170;
    s.animate([{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d-6}px,${Math.sin(a)*d+40}px) scale(.4) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:800+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove(); }
}
function flyStar(fromEl){
  const to=document.getElementById('starCount'); if(!to) return;
  const [x0,y0]=centerOf(fromEl), [x1,y1]=centerOf(to);
  const s=document.createElement('div'); s.className='flystar'; s.textContent='⭐'; s.style.left=x0+'px'; s.style.top=y0+'px'; document.body.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) scale(.4)'},{transform:'translate(-50%,-50%) scale(1.6)',offset:.25},{transform:`translate(calc(${x1-x0}px - 50%),calc(${y1-y0}px - 50%)) scale(.6)`}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{
    s.remove(); to.textContent='⭐ '+state.stars; to.classList.remove('bump'); void to.offsetWidth; to.classList.add('bump'); };

function confetti(){
  for(let i=0;i<90;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.background=FX_COLORS[i%FX_COLORS.length];
    if(i%4===0){ d.style.width='10px'; d.style.height='10px'; d.style.borderRadius='50%'; }

    d.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${sway}px,${innerHeight+60}px) rotate(${Math.random()*1080}deg)`}],{duration:dur,delay:Math.random()*700,easing:'cubic-bezier(.3,.4,.6,1)',fill:'backwards'}).onfinish=()=>d.remove(); }

/* ---------- Answers ---------- */
const PRAISE=['Great reading!','You did it!','Super star!','Brilliant!','Wow!','Yay!','Well done, Ivu!'];
function showPraise(text, color){ ['praise','praise2'].forEach(id=>{ const p=document.getElementById(id); if(!p) return; p.textContent=text; p.style.color=color||''; p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); }); }
async function answer(item, r){
  if(sess.answered) return; sess.answered=true;
  stopAll(); const my=runId;
  record(item,r); sess.results[sess.idx]=r;
  app.querySelectorAll('.mark').forEach(b=>b.disabled=true);
  const pic=document.getElementById('pic'), w=document.getElementById('w'), stage=document.getElementById('stage');
  const dot=app.querySelectorAll('.track i')[sess.idx]; if(dot) dot.className=r;
  if(r==='c'){
    addStar(); chime(true); mascotMood('happy');
    const pr=pick(PRAISE.filter(x=>KID.toUpperCase()==='IVU' || !/Ivu/.test(x)));
    showPraise(pr.replace('Ivu',KID)+' 🎉');
    const [x,y]=centerOf(w); sparks(x,y); flyStar(w);
    if(item.type==='word') w.classList.add('blend');
    await wait(350); if(my!==runId) return; flip(true); await wait(450); if(my!==runId) return;
    await sayBack(item); if(my!==runId) return;
    if(Math.random()<0.45){ await wait(150); if(my!==runId) return; await speak(pr); }
    if(my!==runId) return; await wait(900); if(my===runId) nextCard();
  } else if(r==='h'){

    speak('Good trying!'); await wait(900); if(my!==runId) return;
    if(item.type==='word') await soundOut(w,item.text);
    if(runId!==my+1 && runId!==my) return; const m2=runId;
    flip(true); await wait(500); if(runId!==m2) return; await sayBack(item);
    if(runId!==m2) return; await wait(900); nextCardIf(item);
  } else {
    showPraise("Let's sound it out together 💪",'var(--miss-d)'); mascotMood('think');
    if(!sess.requeued.has(item.id) && item.type!=='story'){ sess.requeued.add(item.id); const at=Math.min(sess.queue.length, sess.idx+4); sess.queue.splice(at,0,item); renderTrack(); }
    await speak("Let's sound it out together.");

    else if(item.type==='sight') await speak(item.text);
    else if(item.type==='letter'){ await playSound(item.text); }
    else if(item.type==='story') await readStory();

    const marks=document.getElementById('marks');

      document.getElementById('next').onclick=()=>{ sess.asked=true; nextCard(); }; }
  }
}
/* Story question: shows understanding, not just decoding */
function askQuestion(item){
  return new Promise(res=>{
    const [qt,opts]=item.q; const order=shuffle(opts.map((o,i)=>[o,i]));
    const ov=document.createElement('div'); ov.className='overlay'; const box=document.createElement('div'); box.className='qmodal glass';
    box.innerHTML=`<div class="qhead">❓ ${esc(qt)} <button class="say" id="qsay">🔊</button></div>
      <div class="picopts">${order.map(([o,i],k)=>`<button class="picopt qopt" data-i="${i}" style="--i:${k}"><span>${o[0]}</span><small>${esc(o[1])}</small></button>`).join('')}</div><div class="praise" id="qpr"></div>`;
    document.body.append(ov,box); let wrong=0, done=false;
    const ask=()=>{ stopAll(); speak(qt); }; box.querySelector('#qsay').onclick=ask; setTimeout(async()=>{ await speak('Now answer the question.'); ask(); },300);
    box.querySelectorAll('.qopt').forEach(b=>b.onclick=async()=>{ if(done) return;
      if(+b.dataset.i===0){ done=true; stopAll(); b.classList.add('right'); if(!wrong){ addStar(); const [x,y]=centerOf(b); sparks(x,y); } chime(true); mascotMood('happy');
        box.querySelector('#qpr').textContent='Yes! You read the whole story! 🎉'; speak(opts[0][1]); await wait(700); await speak('You read the whole story!'); await wait(400); ov.remove(); box.remove(); res(); }
      else { wrong++; b.classList.add('wrong'); b.disabled=true; chime(false); box.querySelector('#qpr').textContent='Try again! 👀'; speak('Try again!'); }
    });
  });
}

let game=null;
function gamePool(){
  const top=Math.max(2,Math.min(state.currentLevel,6));
  const cur=BY_LEVEL[top].filter(i=>PIC[clean(i.text)]);
  let all=[]; for(let l=1;l<=top;l++) all=all.concat(BY_LEVEL[l].filter(i=>PIC[clean(i.text)]));
  return {cur, all};
}
function pickQuestions(n){ const {cur,all}=gamePool(); const a=shuffle(cur).slice(0,Math.ceil(n*0.7)); const rest=shuffle(all.filter(i=>!a.includes(i))).slice(0,n-a.length); return shuffle(a.concat(rest)).slice(0,n); }
function similar(a,b){ let s=0; if(a.length===b.length) s+=2; for(let i=0;i<Math.min(a.length,b.length);i++) if(a[i]===b[i]) s+=1.5; for(const ch of new Set(a)) if(b.includes(ch)) s+=.5; return s; }
function distractors(target){
  const t=clean(target.text), te=PIC[t];
  let pool=[]; for(let l=1;l<=6;l++) pool=pool.concat(BY_LEVEL[l]);
  const seen=new Set([te]); const c=pool.map(i=>clean(i.text)).filter(w=>w!==t && PIC[w]).sort((x,y)=>similar(t,y)-similar(t,x)+(Math.random()-.5));
  const out=[]; for(const w of c){ if(seen.has(PIC[w])) continue; seen.add(PIC[w]); out.push(w); if(out.length===2) break; }
  return out;
}

/* ---------- Oral games: blending & segmenting by ear (no letters) ---------- */
const ORAL2=[['bee',['b','ee'],'🐝'],['key',['k','ee'],'🔑'],['pie',['p','ie'],'🥧'],['tie',['t','ie'],'👔'],['toe',['t','oa'],'🦶'],['shoe',['sh','oo'],'👟'],['zoo',['z','oo'],'🦁'],['cow',['c','ow'],'🐄'],['ice',['ie','s'],'🧊'],['egg',['e','g'],'🥚'],['moo',['m','oo'],'🐮'],['tea',['t','ee'],'🍵'],['sea',['s','ee'],'🌊'],['bow',['b','oa'],'🎀'],['knee',['n','ee'],'🦵'],['up',['u','p'],'⬆️']];
function oralItems(){
  const two=ORAL2.map(([w,s,p])=>({w,s,p,n:2,letters:null}));
  const seen=new Set(two.map(o=>o.p)); const three=[], four=[];
  for(let l=2;l<=6;l++) BY_LEVEL[l].forEach(i=>{ const w=clean(i.text), p=PIC[w]; if(!p || /x|q/.test(w) || seen.has(p)) return; seen.add(p);
    const gs=graphemes(w); const o={w,s:soundKeys(w),p,n:gs.length,letters:gs}; (gs.length===3?three:gs.length===4?four:[]).push(o); });
  return {two,three,four};
}
function oralQuestions(n){
  const {two,three,four}=oralItems(), lv=state.currentLevel;
  const mix = lv<=1 ? [0.7,0.3,0] : lv<=4 ? [0.25,0.75,0] : [0,0.6,0.4];
  const a=Math.round(n*mix[0]), c=Math.round(n*mix[2]), b=n-a-c;
  return shuffle([...shuffle(two).slice(0,a), ...shuffle(three).slice(0,b), ...shuffle(four).slice(0,c)]);
}
function oralDistractors(q){
  const {two,three,four}=oralItems(); const all=[...two,...three,...four].filter(o=>o.p!==q.p);
  const score=o=>(o.n===q.n?2:0)+(o.s[0]===q.s[0]?1.5:0)+(o.s[o.s.length-1]===q.s[q.s.length-1]?1.5:0)+Math.random();
  return all.sort((x,y)=>score(y)-score(x)).slice(0,2);
}
async function playSegments(sounds, dotsEl, gap=450){
  stopAll(); const my=runId; const dots=dotsEl?[...dotsEl.children]:[];
  for(let i=0;i<sounds.length;i++){ if(my!==runId) return; dots.forEach(d=>d.classList.remove('on')); if(dots[i]) dots[i].classList.add('on','lit'); await playSound(sounds[i]); await wait(gap); }
  dots.forEach(d=>d.classList.remove('on'));
}

  });
}
/* 🥁 Sound Tapping: tap the drum once for each sound you hear */
function renderTapQ(){
  if(view!=='game') return; stopAll();
  const q=game.qs[game.idx]; let taps=0, done=false;
  gameShell('🥁 Sound Tapping', `<div class="buildpic">${q.p}</div>
    <div class="badge">Tap the drum once for each sound!</div>
    <div class="snddots big" id="sd"></div>
    <button class="drum" id="drum">🥁</button>
    <div class="reveal" id="rev"></div>`,
    `<button class="tool" id="again">🔊 Say it again</button><button class="tool" id="undo">↩️ Undo</button><button class="tool" id="chk" style="background:#22c55e;color:#fff">✔️ Check</button>`);
  const sd=document.getElementById('sd'), drum=document.getElementById('drum');
  const sayIt=()=>{ stopAll(); speakStretch(q.w).then(()=>speak(q.w)); };
  (async()=>{ if(game.idx===0) await speak('Tap the drum for each sound.'); await wait(200); sayIt(); })();
  document.getElementById('again').onclick=sayIt;
  drum.onclick=()=>{ if(done||taps>=6) return; taps++; sd.insertAdjacentHTML('beforeend','<i class="lit pop"></i>'); drum.classList.remove('hit'); void drum.offsetWidth; drum.classList.add('hit');
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,actx.currentTime); o.frequency.exponentialRampToValueAtTime(60,actx.currentTime+0.15); g.gain.setValueAtTime(0.5,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.2); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.22); }catch(e){} };
  document.getElementById('undo').onclick=()=>{ if(done||!taps) return; taps--; sd.lastElementChild&&sd.lastElementChild.remove(); };
  const demo=async()=>{ sd.innerHTML=q.s.map(()=>'<i></i>').join(''); const rev=document.getElementById('rev');
    rev.innerHTML=(q.letters||[q.w]).map(g=>`<span class="g ${gClass(g)}" style="opacity:.15">${g}</span>`).join('');
    const ds=[...sd.children], ls=[...rev.children]; stopAll(); const my=runId;
    for(let i=0;i<q.s.length;i++){ if(my!==runId) return; ds[i].classList.add('lit','on'); if(ls[i]) ls[i].style.opacity=1; await playSound(q.s[i]); await wait(380); ds[i].classList.remove('on'); }
    if(!q.letters) ls.forEach(l=>l.style.opacity=1); await speak(q.w); };
  document.getElementById('chk').onclick=async()=>{ if(done) return; if(!taps){ showPraise('Tap the drum first! 🥁'); return; } done=true;
    const ok=taps===q.s.length; game.res[game.idx]=ok?'c':'h'; renderTrackG();
    if(ok){ addStar(); const [x,y]=centerOf(sd); sparks(x,y); flyStar(sd); chime(true); mascotMood('happy'); showPraise(`Yes! ${q.s.length} sounds! 🎉`); }
    else { chime(false); mascotMood('think'); showPraise(`It has ${q.s.length} sounds — let's listen 👂`,'var(--miss-d)'); }
    await wait(500); await demo(); await wait(1000); gameNext(); };
}

/* ---------- Today's lesson: a guided 10-minute routine ---------- */
let lesson=null;
function lessonPlan(){ const lv=state.currentLevel;
  if(lv===0) return [['hear',5,'👂 Listen & Blend'],['read',10,'📖 Read together'],['tap',4,'🥁 Sound Tapping']];
  if(lv<=6) return [['hear',5,'👂 Listen & Blend'],['read',8,'📖 Read together'],['tap',4,'🥁 Sound Tapping'],[lv<=1?'pic':'build',4,lv<=1?'🖼️ Read & Pick':'🧩 Build the Word']];
  return [['hear',4,'👂 Listen & Blend'],['read',8,'📖 Read together'],['pic',5,'🖼️ Read & Pick']]; }
function lessonDoneToday(){ return (state.lessons||[]).includes(today()); }
function startLesson(){ lesson={i:0, steps:lessonPlan()}; runLessonStep(); }
function runLessonStep(){ const [t,n]=lesson.steps[lesson.i]; if(t==='read') startSession('together', state.currentLevel, n); else startGame(t, n); }
function lessonChip(){ return lesson? `<span class="chip lessonchip">⭐ ${lesson.i+1}/${lesson.steps.length}</span>` : ''; }
function lessonSummaryButtons(){
  if(!lesson) return; const sb=document.querySelector('.sumbtns'); if(!sb) return; const last=lesson.i>=lesson.steps.length-1;
  sb.innerHTML=`<button class="btn3d b-purple" id="lnext" style="font-size:28px;padding:20px 46px">${last?'🎉 Finish lesson':'Next: '+lesson.steps[lesson.i+1][2]+' ▶'}</button><button class="btn3d b-orange" id="lstop">🏠 Stop</button>`;
  document.getElementById('lstop').onclick=()=>{ lesson=null; renderHome(); };
  document.getElementById('lnext').onclick=()=>{ if(last) finishLesson(); else { lesson.i++; speak('Next activity!'); runLessonStep(); } };
}
function finishLesson(){
  lesson=null; state.lessons=state.lessons||[]; if(!state.lessons.includes(today())) state.lessons.push(today()); addStar(); addStar(); addStar(); save();
  view='summary';
  app.innerHTML=`<div class="glass summary screen"><div class="trophy">🏆</div>${mascotSVG('happy')}

/* ---------- Daily tip for grown-ups ---------- */
const TIPS={
  early:['Play “robot talk” today: “Touch your n-o-se!” — blending by ear is the key skill.','Say sounds without “uh”: “mmm” not “muh”, “sss” not “suh”.','Play I-spy with sounds: “I spy a c-a-t”. 5 minutes in the car is perfect.','Stretch words like a rubber band: “mmmaaannn” — then snap it: “man!”','Stop while he still wants more. Short and happy beats long and tired.','Ask him to say the sounds in “sun”, tapping a finger for each: s-u-n.'],
  words:['Let him drive the 🚗 blending car himself — moving his hand helps sounds join.','Make words with fridge magnets: “cat” → swap the c for h → “hat”.','Point to one word on a cereal box or sign each day that he can sound out.','When he’s stuck, say the sounds a bit faster each time: “c-a-t, c-a-t, cat!”','Praise effort: “You worked so hard on that word!”','Review yesterday’s words first — remembering after sleep makes them stick.'],
  sentences:['Read a decodable book together: he reads one page, you read the next.','Run your finger under each word as he reads a sentence.','Ask a question after a sentence: “Who sat on the mat?” — reading is understanding too.','Star words (the, is, was) can’t be sounded out — practise them as a quick “snap” game.','Let him read to a teddy or grandparent on video call — he’ll love being the teacher.']

  <div class="panel"><h2>Voice</h2>
    <div class="field"><label>Recorded model voice</label><input type="checkbox" id="hv" ${s.humanVoice?'checked':''}> <span class="note">Recommended for phoneme accuracy. Turning this off uses text-to-speech, which may say letter names or add an “uh” after stop sounds. Your own recordings still take priority.</span></div>
    <div class="field"><label>Computer voice (for whole words)</label><select id="voice">${list.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&cur.voiceURI===v.voiceURI?'selected':''}>${isNatural(v)?'⭐ ':''}${esc(v.name)} (${esc(v.lang)})</option>`).join('')||'<option>No voices found</option>'}</select> <button class="sbtn" id="testv">▶ Test</button></div>
    <p class="note">${anyNat?'⭐ = natural, human-sounding voice (recommended).':'<b>No natural (human-sounding) voices found in this browser.</b> For the most human computer voice, open this file in <b>Microsoft Edge</b> — it has free natural voices like “Sonia” and “Libby” (needs internet). On a Mac, Safari/Chrome can use “enhanced” voices downloaded in System Settings → Accessibility → Spoken Content.'}</p>
    <div class="field"><label>Speaking speed</label><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${s.rate}"> <span id="ratev">${s.rate}</span></div>
    <div class="field"><label>How the voice says “Ivu”</label><input type="text" id="nameSay" value="${esc(s.nameSay)}"> <button class="sbtn" id="testn">▶ Test</button></div>
    <p class="note">The name is written “Ivu” in the stories. If the voice says it wrong, change the spelling above until it sounds like “E-vu” (try “Eevoo”, “Evu”, “Eevu”).</p>
  </div>
  <div class="panel"><h2>Learning rules</h2>
    <div class="field"><label>✅ reads needed to master a word</label><select id="mr">${[2,3,4].map(n=>`<option ${n===s.masteryReads?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Must be on 2 different days</label><input type="checkbox" id="td" ${s.twoDays?'checked':''}> <span class="note">Recommended — proves it stuck overnight.</span></div>
    <div class="field"><label>Cards per session</label><select id="cards">${[8,10,12,15].map(n=>`<option ${n===s.cards?'selected':''}>${n}</option>`).join('')}</select> <span class="note">Fewer for sentences and stories automatically.</span></div>
  </div>
  <div class="panel"><h2>Backup</h2>
    <p class="note">Progress is saved in this browser on this laptop only. Download a backup now and then (it includes your recorded sounds). Clearing browser data will erase it.</p>
    <button class="sbtn" id="exp">⬇ Download backup</button>
    <label class="sbtn" style="display:inline-block">⬆ Restore backup <input type="file" id="imp" accept=".json,application/json" style="display:none"></label>
    <button class="sbtn warn" id="reset">Reset all progress</button>
  </div>`;
}
function bindSettings(){
  const s=state.settings; const $=id=>document.getElementById(id);
  $('voice').onchange=e=>{ s.voiceURI=e.target.value; save(); };
  $('hv').onchange=e=>{ s.humanVoice=e.target.checked; save(); };
  $('kidName').onchange=e=>{ s.kidName=(e.target.value.trim()||'IVU').slice(0,16); KID=s.kidName; save(); };
  $('testv').onclick=()=>{ stopAll(); const hv=s.humanVoice; s.humanVoice=false; speak('The cat sat on a mat.'); s.humanVoice=hv; };
  $('rate').oninput=e=>{ s.rate=+e.target.value; $('ratev').textContent=s.rate; save(); };
  $('nameSay').onchange=e=>{ s.nameSay=e.target.value.trim()||'Eevoo'; save(); };
  $('testn').onclick=()=>{ s.nameSay=$('nameSay').value.trim()||'Eevoo'; save(); stopAll(); speak('Ivu has a red car.'); };
  $('mr').onchange=e=>{ s.masteryReads=+e.target.value; save(); };
  $('td').onchange=e=>{ s.twoDays=e.target.checked; save(); };
  $('cards').onchange=e=>{ s.cards=+e.target.value; save(); };
  $('exp').onclick=()=>{ const blob=new Blob([JSON.stringify({app:'ivu-reads',state,sounds})],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ivu-reads-backup-${today()}.json`; a.click(); };
  $('imp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(d.app!=='ivu-reads'||!d.state) throw new Error('Not an IVU Reads backup');
      if(!confirm('Replace current progress with this backup?')) return;
      localStorage.setItem(KEY,JSON.stringify(d.state)); localStorage.setItem(SKEY,JSON.stringify(d.sounds||{})); state=load(); sounds=d.sounds||{}; renderParent(); alert('Backup restored.'); }
    catch(err){ alert('Could not restore: '+err.message); } };
  $('reset').onclick=()=>{ if(confirm('Erase ALL reading progress? (Recorded sounds are kept.)') && confirm('Are you sure?')){ state=defaultState(); save(); renderParent(); } };
}

/* ---------------- Recording wizard ---------------- */
let wizIdx=0, wizKeys=SOUND_KEYS;
const TRICKY_KEYS=['c','t','b','d','g','p','k','a','e','i','o','u','h','j','w','y'];
function renderWizard(){
  view='wizard'; stopAll();
  const k=wizKeys[wizIdx], [word,em,tip]=SOUND_HINT[k]; const has=!!sounds[k];
  const done=wizKeys.filter(x=>sounds[x]).length;
  const wordHtml = word.replace(new RegExp(k), m=>`<b style="color:var(--vowel)">${m}</b>`);
  app.innerHTML=`<div class="parent">
    <div class="topbar"><h1>🎙️ Record the sounds — ${wizIdx+1} of ${wizKeys.length}</h1><button class="xbtn" id="wclose">✓ Done</button></div>
    <div class="dots" style="margin:12px 0">${wizKeys.map((x,i)=>`<i class="${sounds[x]?'c':''} ${i===wizIdx?'now':''}" title="${x}"></i>`).join('')}</div>
    <div class="stage" style="min-height:360px">
      <div class="g ${gClass(k)}" style="font-size:170px;cursor:default">${k}</div>
      <div style="font-size:30px;margin-top:6px;font-family:Andika,'Comic Sans MS'">${em} as in <span>${wordHtml}</span></div>
      <div style="font-size:20px;color:var(--muted);margin-top:10px;text-align:center;max-width:620px">Say: ${tip}</div>
      <div style="margin-top:14px;font-size:16px;color:${has?'var(--good)':'var(--muted)'}">${has?'✔ Recorded in your voice — press ▶ to check, or record again':'Not recorded yet'}</div>
    </div>
    <div class="tools">
      <button class="tool" id="wprev" ${wizIdx===0?'disabled style="opacity:.4"':''}>← Back</button>
      <button class="tool" id="wrec" data-label="🎤 Record" style="background:#fde8e1;color:#8a2c0d;font-weight:700;min-width:200px">🎤 Record</button>
      <button class="tool" id="wplay" ${has?'':'disabled style="opacity:.4"'}>▶ Play</button>
      <button class="tool" id="wnext">${wizIdx===wizKeys.length-1?'Finish ✓':'Next →'}</button>
    </div>
    <p class="note" style="text-align:center;font-size:15px;margin-top:16px">Press Record, then say the sound <b>straight away</b> (you have 2 seconds). Say just the sound, not the letter name and not the word.
    Keep it short and clean — for b, d, g, p, t, c say it <b>without “uh”</b> after it.<br>${done} of ${wizKeys.length} recorded. Keyboard: R = record, P = play, → next, ← back.</p>
  </div>`;
  const $=id=>document.getElementById(id);
  $('wclose').onclick=()=>{ parentTab='sounds'; renderParent(); };
  $('wprev').onclick=()=>{ if(wizIdx>0){ wizIdx--; renderWizard(); } };
  $('wnext').onclick=()=>{ if(wizIdx<wizKeys.length-1){ wizIdx++; renderWizard(); } else { parentTab='sounds'; renderParent(); } };
  $('wplay').onclick=()=>{ if(sounds[k]){ stopAll(); playUrl(sounds[k]); } };
  $('wrec').onclick=()=>recordSound(k, $('wrec'), renderWizard);
}

/* keyboard shortcuts for the grown-up in "together" mode: 1 = ✅, 2 = 🟡, 3 = ❌, space = sound it out, → = next */
document.addEventListener('keydown',e=>{
  if(view==='deck'){ const m={ArrowRight:'nextc',ArrowLeft:'prev',' ':'dflip',f:'dflip',F:'dflip'}[e.key]; if(m){ e.preventDefault(); const b=document.getElementById(m); if(b&&!b.disabled) b.click(); } return; }
  if(view==='wizard'){ const m={r:'wrec',R:'wrec',p:'wplay',P:'wplay',ArrowRight:'wnext',ArrowLeft:'wprev'}[e.key]; if(m){ const b=document.getElementById(m); if(b && !b.disabled && !b.classList.contains('live')) b.click(); } return; }
  if(view!=='session' || e.target.tagName==='INPUT') return;
  const map={'1':'c','2':'h','3':'x'};
  if(map[e.key] && sess.mode==='together'){ const b=app.querySelector(`.mark[data-r="${map[e.key]}"]`); if(b && !b.disabled) b.click(); }
  if(e.key==='f'||e.key==='F'){ const b=document.getElementById('flipBtn'); if(isFlipped()){ if(!sess.answered) flip(false); } else if(b) b.click(); }
  if(e.key===' '){ e.preventDefault(); const b=document.getElementById('tOut')||document.getElementById('tSound')||document.getElementById('tSay')||document.getElementById('tRead'); if(b) b.click(); }
  if(e.key==='ArrowRight'){ const n=document.getElementById('next'); if(n && !n.classList.contains('hidden')) n.click(); }
});

let lastCols=innerWidth<720; addEventListener('resize',()=>{ const c=innerWidth<720; if(c!==lastCols){ lastCols=c; if(view==='home') renderHome(); } });
renderHome();
</script>
